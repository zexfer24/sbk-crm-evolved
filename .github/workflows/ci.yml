name: CI

# Corre en cada push a main y en cada PR. La idea es que nada llegue a
# producción sin que estas tres puertas hayan pasado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: whatwg-url, que entra como dependencia transitiva,
          # exige >=22.14 y con 20 npm avisa EBADENGINE.
          node-version: "22"
          cache: npm

      - run: npm ci

      # Los tipos globales de Next (PageProps, LayoutProps…) no viven en el
      # repo: los genera Next en `.next/types`, y `next-env.d.ts` está
      # gitignorado. En un checkout limpio `tsc` fallaba aunque el código
      # estuviera sano — este paso faltó desde el estreno del workflow y CI
      # estuvo rojo en "Tipos" al menos del run #23 al #28 (29/8/2026) sin
      # que ninguna otra puerta llegara a correr.
      - name: Generar tipos de Next
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Sin paralelismo de archivos: la contención del pool de forks que en
      # Windows de 8 núcleos ya obligó a subir testTimeout a 15s (ver
      # vitest.config.ts) es peor en el runner de 2 núcleos — el run #29
      # (29/8/2026), primero en llegar a esta puerta, cayó aquí con la suite
      # verde en local. Un archivo a la vez cuesta minutos de reloj, no
      # veredictos falsos.
      - name: Pruebas
        run: npm run test -- --no-file-parallelism

      # Las NEXT_PUBLIC_* se incrustan al compilar, así que el build necesita
      # valores aunque sean de mentira: acá solo se comprueba que compila, no
      # se habla con ninguna base.
      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_CRM_TIME_ZONE: America/Caracas

  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres y aplica migraciones y seeds desde cero. Es la
      # comprobación de que el esquema se puede reconstruir con lo que hay en
      # el repositorio, que es lo que hará el despliegue.
      - name: Reconstruir la base desde cero
        run: supabase db start

      - name: Comprobar que quedó en pie
        run: |
          supabase db query --local "select public.agent_can_run()"
          supabase db query --local "select public from storage.buckets where id = 'whatsapp-media'"

      # Auditoría del 30/8/2026: con la anon key pública y sin sesión,
      # `agent_metrics` devolvía HTTP 200 con métricas de ventas por asesor,
      # porque Supabase deja de fábrica toda función `security definer` nueva
      # ejecutable por `anon`. `supabase db query --local` corre como
      # superusuario y no ve ese agujero (los privilegios de rol no aplican
      # a quien los tiene todos) — por eso este paso conecta como el rol
      # `postgres` normal, vía psql directo, para que `has_function_privilege`
      # mida lo mismo que mide un cliente real de PostgREST. `psql` viene
      # instalado de fábrica en el runner de ubuntu.
      - name: Permisos de funciones security definer
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/permisos_funciones.sql
