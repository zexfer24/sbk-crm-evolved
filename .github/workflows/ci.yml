name: CI

# Corre en cada push a main y en cada PR. La idea es que nada llegue a
# producción sin que estas tres puertas hayan pasado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 y no 20: whatwg-url, que entra como dependencia transitiva,
          # exige >=22.14 y con 20 npm avisa EBADENGINE.
          node-version: "22"
          cache: npm

      - run: npm ci

      # Los tipos globales de Next (PageProps, LayoutProps…) no viven en el
      # repo: los genera Next en `.next/types`, y `next-env.d.ts` está
      # gitignorado. En un checkout limpio `tsc` fallaba aunque el código
      # estuviera sano — este paso faltó desde el estreno del workflow y CI
      # estuvo rojo en "Tipos" al menos del run #23 al #28 (29/8/2026) sin
      # que ninguna otra puerta llegara a correr.
      - name: Generar tipos de Next
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Sin paralelismo de archivos: la contención del pool de forks que en
      # Windows de 8 núcleos ya obligó a subir testTimeout a 15s (ver
      # vitest.config.ts) es peor en el runner de 2 núcleos — el run #29
      # (29/8/2026), primero en llegar a esta puerta, cayó aquí con la suite
      # verde en local. Un archivo a la vez cuesta minutos de reloj, no
      # veredictos falsos.
      - name: Pruebas
        run: npm run test -- --no-file-parallelism

      # Las NEXT_PUBLIC_* se incrustan al compilar, así que el build necesita
      # valores aunque sean de mentira: acá solo se comprueba que compila, no
      # se habla con ninguna base.
      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_CRM_TIME_ZONE: America/Caracas

  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres y aplica migraciones y seeds desde cero. Es la
      # comprobación de que el esquema se puede reconstruir con lo que hay en
      # el repositorio, que es lo que hará el despliegue.
      - name: Reconstruir la base desde cero
        run: supabase db start

      - name: Comprobar que quedó en pie
        run: |
          supabase db query --local "select public.agent_can_run()"
          supabase db query --local "select public from storage.buckets where id = 'whatsapp-media'"

      # Auditoría del 30/8/2026: con la anon key pública y sin sesión,
      # `agent_metrics` devolvía HTTP 200 con métricas de ventas por asesor,
      # porque Supabase deja de fábrica toda función `security definer` nueva
      # ejecutable por `anon`. `supabase db query --local` corre como
      # superusuario y no ve ese agujero (los privilegios de rol no aplican
      # a quien los tiene todos) — por eso este paso conecta como el rol
      # `postgres` normal, vía psql directo, para que `has_function_privilege`
      # mida lo mismo que mide un cliente real de PostgREST. `psql` viene
      # instalado de fábrica en el runner de ubuntu.
      - name: Permisos de funciones security definer
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/permisos_funciones.sql

      # La invariante "ningún lead invisible" (ver CLAUDE.md). Va acá y no en
      # vitest porque el número que verifica lo calcula una función SQL, y
      # porque su gemelo en TypeScript —`isUnassignedLead`, el que arma la
      # píldora de la bandeja— tiene su propio archivo de contrato con los
      # MISMOS casos: si las dos definiciones se separan, uno de los dos se
      # pone rojo. Corre en transacción con rollback, no ensucia la base.
      - name: Invariante "ningún lead invisible"
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/invariante_leads.sql

      # T0.1 (5/9/2026): awaiting_reply ahora se apaga solo con una respuesta
      # real (last_reply_at), no con cualquier insert en messages. Este
      # script recorre los ocho casos que la reforma existe para arreglar
      # (nota interna, evento de sistema, bienvenida automática, rechazo de
      # Meta...). Transacción con rollback, igual que el paso de arriba.
      - name: awaiting_reply distingue una respuesta real
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/awaiting_reply.sql

      # F13 (5/9/2026): la bandeja busca contactos sin acentos ni mayúsculas.
      # contacts.search_text reutiliza public.immutable_unaccent, el mismo
      # wrapper de products.search_text (20260822100000) y
      # messages.search_text (20260822110000).
      - name: contacts.search_text encuentra sin acentos
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/contacts_search.sql

      # T2.2 (5/9/2026): hasta tres chats fijados por asesor. El trigger
      # conversation_pins_limit_before_insert rechaza el cuarto pin, y la
      # política RLS aísla los pines de cada agente de los del resto.
      - name: conversation_pins -- tope de tres y aislamiento por agente
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/pins.sql

      # T3.2 (5/9/2026): 'played' (nota de voz reproducida) tiene que rankear
      # por encima de 'read' en whatsapp_status_rank(), o keep_whatsapp_status_
      # moving_forward() dejaría que un "leído" tardío de Meta retrocediera el
      # doble check sobre un "reproducido" que el asesor ya vio en pantalla.
      - name: whatsapp_status -- 'played' no retrocede
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/whatsapp_status_forward.sql

      # Frente B1 (plan "El reloj dice la verdad", 5/9/2026):
      # agent_settings.business_hours guarda el horario de la tienda como
      # jsonb (mon..sun, franjas [inicio, fin]). El default trae los siete
      # días con L-V 08:00-18:00 y fin de semana cerrado, y el check
      # agent_settings_business_hours_object rechaza cualquier forma que no
      # sea un objeto (ej. un array).
      - name: agent_settings.business_hours -- default y forma de objeto
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/business_hours.sql

      # T1, corrida "La ventana de 24 h dice la verdad" (7/9/2026): un
      # `unsupported` entrante no mueve last_customer_message_at/unread_count
      # (candado A), y un saliente rechazado por Meta con 131047 la empuja
      # hacia atrás -- created_at menos 24h -- en los dos caminos que pueden
      # dejar un mensaje en 'failed' (INSERT ya fallido de la IA, UPDATE del
      # asesor y del callback de Meta) (candado B). El caso 6 reaplica la
      # migración con `\i` para probar el backfill sobre datos sembrados
      # después de que la base ya la corrió una vez al construirse.
      - name: la ventana de 24 h no miente -- unsupported y 131047
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/ventana_24h.sql

      # T1, corrida "La IA ve lo que llega" (8/9/2026): un turno que se queda
      # sin nada legible que mostrarle al modelo (historial vacío, típico un
      # chat que abre con un audio/foto/sticker sin texto) ahora escribe
      # record_handoff(..., reason => 'sin_contenido_legible') en vez de
      # salir mudo -- caso real cea69118-5d17-4f08-84c6-925755672b87, 30
      # reencolados por el reconciliador. El backfill de la migración limpia
      # las conversaciones que ese bug dejó congeladas en
      # classifying/tool_running sin lock vigente.
      - name: un turno sin contenido legible deja rastro y limpia su etapa
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/traspaso_sin_contenido_legible.sql

      # T1, corrida "La bandeja habla español y el número nuevo queda a un
      # clic" (8/9/2026): la preview de la lista mostraba "Image", "Audio",
      # "Sticker", "Unsupported" en inglés crudo cuando el último mensaje
      # visible no traía content -- deuda dejada por la corrida "El cliente
      # que cambió de número" (6/9/2026). Va en la base porque
      # last_message_preview es la única fuente de verdad que lee la
      # bandeja: message_preview_label() traduce el tipo, handle_new_message()
      # la usa como respaldo de content, y el caso 6 reaplica la migración
      # con `\i` para probar el backfill sobre previews que ya quedaron en
      # inglés antes de esta migración.
      - name: la preview de la bandeja habla español
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/preview_en_espanol.sql

      # T1, corrida "La voz cercana y la espera visible" (14/9/2026): los
      # cinco valores de intención (agent_turns.intent/conversations.intent,
      # sumando fuera_de_tema) y la razón cortesia_tras_escalada de
      # conversation_handoffs quedan admitidos en la base. Este test existía
      # desde el 14/9 pero no estaba cableado en este job -- se detectó al
      # preparar la Tarea 1 de "La voz de mostrador con nombre propio"
      # (15/9/2026).
      - name: los cinco valores de intención y la cortesía tras escalada
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/intenciones_y_traspasos_completos.sql

      # Tarea 1, "La voz de mostrador con nombre propio y el cierre de v1.1"
      # (15/9/2026): "SBK Motorcycles" quedó sembrado como DATO -- no solo
      # como texto de código -- en knowledge_categories (la categoría "La
      # tienda", 20260825020000) y podía repetirse en knowledge_entries y
      # ai_playbooks escritos a mano desde el panel; ambas cosas le llegan al
      # cliente verbatim. La migración reemplaza el nombre viejo por "SBK
      # Motors" en las tres tablas, sin tocar templates (texto ya aprobado
      # por Meta).
      - name: la base dice SBK Motors donde decía SBK Motorcycles
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/marca_sbk_motors.sql

      # Tarea 1, "La IA no vuelve a pedir lo que ya pidió" (16/9/2026):
      # ai_resume_cutoff_at sella el instante en que un humano le devuelve
      # el chat a la IA (ai_enabled=true y sin asesor, viniendo de otro
      # estado), copiando last_customer_message_at de ESE momento -- nunca
      # now(), por la latencia de Meta. new_since_ai_resume (columna
      # generada) dice si el último mensaje del cliente es posterior al
      # sello: el reconciliador y el turno dejan de reencolar/contestar un
      # mensaje que ya estaba ahí cuando lo devolvieron. Reemplaza al
      # diseño de 20260915020000 (awaiting_any_reply contra last_message_at,
      # deshecho el 16/9/2026: no distinguía un mensaje anterior a la
      # devolución de uno posterior). Y un asesor que desasigna una
      # conversación o reactiva la IA deja rastro en conversation_handoffs
      # (desasignada_por_asesor/devuelto_a_ia): antes de esta migración esos
      # dos movimientos de dueño no dejaban ninguna fila, y un cliente podía
      # recibir dos veces la misma despedida de escalada si un asesor
      # desasignaba y reactivaba la IA en menos de un minuto.
      - name: la IA solo atiende lo posterior al sello de devolución
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/devolucion_a_la_ia.sql

      # T0, plan "Seba atiende el mostrador" (18/9/2026):
      # welcome_sent_at pasa a ser el sello de "Seba ya se presentó"
      # (backfill con COALESCE(last_reply_at, last_message_at, created_at),
      # nunca now()); conversation_handoffs.reason suma
      # silenciada_por_asesor, la razón que deja rastro cuando un asesor
      # manda su primer mensaje real (trigger nuevo
      # messages_agent_silences_ai_trigger, AFTER INSERT ON messages) o
      # alguien pausa la IA a mano (setAiEnabled(false)) -- los dos caminos
      # que apagaban ai_enabled sin dejar ninguna fila hasta esta migración.
      # La rama reclamado de handle_conversation_ownership_change gana
      # `auth.uid() is not null` (hallazgo 1 del plan): sin esa guarda, la
      # escalada que una tarea futura de la misma corrida va a dejar
      # cambiando SOLO assigned_agent_id (con service_role, sin sesión)
      # dejaría una fila reclamado espuria antes de su propia fila
      # escalada.
      - name: la escalada no apaga la IA; el primer mensaje del asesor sí
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/seba_y_escalada_viva.sql

      # T1, plan "Seba atiende el mostrador" (18/9/2026): la tabla ai_lessons
      # (requisito 7 del cliente: un asesor corrige a Seba desde un mensaje y
      # la IA lo lee en cada turno). El test mide RLS con roles reales
      # (autor, otro agente, supervisor), los CHECK y que la tabla esté
      # publicada en supabase_realtime -- un canal muerto no falla, calla
      # (ver CLAUDE.md, conversation_handoffs).
      - name: lecciones de Seba (RLS, CHECK y Realtime)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/ai_lessons.sql

      # M1, plan "Nada sin leer, un solo catálogo y la factura Saint"
      # (18/9/2026): la URL de cada catálogo (hoy archivos de Google Drive de
      # un tercero) sale de la tabla catalog_links en vez de estar pegada a
      # mano en tres escenarios y cuatro mensajes rápidos -- el catálogo de
      # cascos tuvo cuatro IDs de Drive distintos en 25 días y el 18/9
      # circulaban dos versiones a la vez porque la URL estaba copiada en
      # más de un sitio. El test mide RLS con roles reales (asesor lee/no
      # escribe, supervisor sí escribe, anon no lee nada), los CHECK de
      # clave/URL y la unicidad de la clave, y que la tabla esté publicada
      # en supabase_realtime.
      - name: catalog_links -- CHECK, RLS y Realtime
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/catalog_links.sql

      # M2, plan "Nada sin leer, un solo catálogo y la factura Saint"
      # (18/9/2026): `orders.saint_invoice_number` guarda el número de la
      # factura emitida en Saint (el sistema administrativo del negocio) --
      # DISTINTO de `invoices.number` (el correlativo interno del CRM). Nace
      # nullable (las ventas cerradas antes del 18/9/2026 no lo tienen) y el
      # CHECK exige, cuando no es null, el texto ya recortado y de 1 a 40
      # caracteres; el modal "Cerrar venta" (T5 de este mismo plan) lo hace
      # obligatorio del lado de la interfaz.
      - name: orders.saint_invoice_number -- CHECK
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/factura_saint.sql

      # T1, plan "El catálogo configurado sale siempre" (21/9/2026):
      # ai_playbooks.cede_al_inventario nace NOT NULL DEFAULT false; solo un
      # supervisor/admin puede marcarla (misma política ai_playbooks_write de
      # siempre, sin agujero nuevo para la columna) y un asesor corriente
      # puede leerla pero no escribirla.
      - name: escenario_cede_al_inventario -- columna, default y RLS
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/escenario_cede_al_inventario.sql

      # T4a, plan "La escalada se hace una vez y la búsqueda responde"
      # (21/9/2026, Frente 4): agent_turns.reasoning_tokens nace NOT NULL
      # DEFAULT 0, sin backfill -- el hueco donde T4b va a medir el
      # razonamiento interno del modelo que hoy AI_AGENT_REASONING=off deja
      # sin cuantificar (dos turnos del 21/9/2026 gastaron ~65.800 tokens de
      # salida contra un mensaje visible de ~40).
      - name: agent_turns.reasoning_tokens -- columna y default
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/agent_turns_reasoning_tokens.sql

      # T3, plan "La escalada se hace una vez y la búsqueda responde"
      # (21/9/2026, Frente 1, D3): en producción TODA búsqueda de /inbox daba
      # 500 por statement timeout (156 de 156 en 48 h) -- la función vieja
      # (security invoker) evaluaba is_agent() por fila vía RLS y su filtro
      # NOT EXISTS correlacionado no podía usar el índice GIN trigram de
      # messages.search_text. La nueva (security definer, is_agent() UNA vez,
      # LIKE ALL contra un arreglo constante) se midió contra ~100.000
      # mensajes sembrados por este mismo test: la vieja tardó 1,0-1,2 s como
      # authenticated, la nueva 20-140 ms -- el caso 8 (rendimiento) siembra
      # ese volumen con session_replication_role=replica y compara contra un
      # umbral de 500 ms. Puede sumar unos segundos al job por el sembrado;
      # medido en local en ~6-7 s de más.
      - name: search_conversations_by_message -- sin RLS por fila, 8+2 casos
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/search_conversations_by_message.sql
