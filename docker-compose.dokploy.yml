# =============================================================================
# SBK Motorcycles CRM en Dokploy.
#
# En Dokploy: Create Service → Compose → Provider Git → Compose Path
# `./docker-compose.dokploy.yml`. Las variables se pegan en la pestaña
# Environment; el dominio se añade en la pestaña Domains apuntando al servicio
# `app`, puerto 3000.
#
# Tres diferencias con `docker-compose.yml` (el de servidor propio), y las tres
# son por cómo trabaja Dokploy:
#
#   1. Sin Caddy. Dokploy ya tiene Traefik ocupando los puertos 80 y 443, con
#      Let's Encrypt automático. Dejar Caddy acá no es redundante: el stack no
#      levanta, porque los puertos ya están tomados. Lo que se pierde son las
#      cabeceras de seguridad que ponía el Caddyfile, y por eso ahora las pone
#      la propia aplicación (ver `headers()` en next.config.ts).
#
#   2. `env_file: .env` y no `.env.production`. Dokploy escribe lo de la
#      pestaña Environment en un `.env` dentro del directorio del proyecto. El
#      nombre `.env.production` no lo conoce, y un `env_file` que no existe
#      aborta el arranque.
#
#   3. La app vive en dos redes. `default` para alcanzar a Redis; la externa
#      `dokploy-network` para que Traefik la encuentre. Sin la segunda, el
#      dominio responde 502 aunque el contenedor esté sano.
#
# La base NO está acá: se asume Supabase (gestionado o en otro servidor).
# =============================================================================

services:
  app:
    build:
      context: .
      args:
        # Las NEXT_PUBLIC_* se incrustan al compilar: en tiempo de arranque ya
        # es tarde, por eso van también acá. Salen del `.env` que arma Dokploy.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_CRM_TIME_ZONE: ${NEXT_PUBLIC_CRM_TIME_ZONE:-America/Caracas}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      # Redis y el cron hablan con la app por acá.
      - default
      # Traefik enruta el dominio por acá. Es la red que crea Dokploy al
      # instalarse; por eso es `external`.
      - dokploy-network
    # Solo hace falta si Supabase corre en el MISMO servidor (self-hosted):
    # en Linux, host.docker.internal no existe sin esto. Con Supabase
    # gestionado la URL es pública y esta línea no molesta.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Cola de turnos del agente. `--appendonly yes` no es opcional: sin
  # persistencia, un reinicio se lleva los turnos pendientes y esos clientes
  # se quedan sin respuesta.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      # Solo en la red interna: fuera del alcance de Traefik y de internet.
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sin `ports`: solo la app la alcanza, por la red interna de Compose.

  # Procesa lo que quedó pendiente en la cola de turnos: el proceso que murió a
  # mitad, o el turno que falló y espera otro intento. El camino normal es que
  # el propio webhook procese lo que encola; esto es la red de seguridad.
  #
  # Dokploy también trae Schedules propios, pero este servicio ya está probado
  # y no depende de configuración fuera del repositorio.
  cron:
    image: alpine:3
    restart: unless-stopped
    env_file: .env
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      # Bloque literal (|) y no plegado (>): con `>` las líneas más indentadas
      # del curl NO se pliegan, el salto de línea sobrevive y la cabecera
      # Authorization termina ejecutándose como un comando aparte. Resultado:
      # el cron pegaba sin token (401) y la cola se quedaba sin red de
      # seguridad. Acá cada línea es un comando completo y la continuación
      # del curl es explícita con `\`.
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep 300
          curl -fsS -X POST http://app:3000/api/cron/process-queue \
            -H "Authorization: Bearer $$CRON_SECRET" >/dev/null || true
        done

volumes:
  redis_data:

networks:
  dokploy-network:
    external: true
