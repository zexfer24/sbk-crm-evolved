# =============================================================================
# SBK Motorcycles CRM en un servidor propio.
#
# Para Dokploy hay otro archivo: `docker-compose.dokploy.yml`. Este de acá
# levanta su propio Caddy y allá no sirve, porque Traefik ya ocupa el 80 y el
# 443.
#
#   cp .env.production.example .env.production   # y complétalo
#   docker compose --env-file .env.production up -d
#
# El `--env-file` no sobra: sin él, Compose usa `.env` para resolver los
# ${...} de este archivo y DOMAIN llegaría vacío, con lo que Caddy no pediría
# certificado para ningún dominio. Comprobado: sin el flag avisa que las
# variables no están definidas.
#
# Caddy saca y renueva el certificado TLS solo, con que el dominio apunte al
# servidor. El webhook de Meta exige HTTPS, así que esto no es opcional.
#
# La base NO está acá: se asume Supabase (gestionado o en otro servidor). Meter
# Postgres en este compose obligaría a resolver sus respaldos y su disco en el
# mismo sitio, y esas son decisiones aparte.
# =============================================================================

services:
  app:
    build:
      context: .
      args:
        # Las NEXT_PUBLIC_* se incrustan al compilar: en tiempo de arranque ya
        # es tarde, por eso van también acá.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_CRM_TIME_ZONE: ${NEXT_PUBLIC_CRM_TIME_ZONE:-America/Caracas}
    restart: unless-stopped
    # Techos de recursos: el servidor también corre el stack de Supabase, y
    # sin límites un proceso desbocado se lo lleva entero (pasó con la
    # introspección de PostgREST). Los techos contienen, no reparten; la
    # reserva de memoria marca el mínimo vital de la app.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    env_file: .env.production
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    # Solo hace falta si Supabase corre en el MISMO servidor (self-hosted):
    # en Linux, host.docker.internal no existe sin esto. Con Supabase
    # gestionado la URL es pública y esta línea no molesta.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Cola de turnos del agente. `--appendonly yes` no es opcional: sin
  # persistencia, un reinicio se lleva los turnos pendientes y esos clientes
  # se quedan sin respuesta.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # La cola de turnos son pocos KB: si Redis llegara a este techo es que
    # algo anda muy mal, y mejor que se note acá y no en el resto del server.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sin `ports`: solo la app la alcanza, por la red interna de Compose.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy pide el certificado para este dominio.
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Procesa lo que quedó pendiente en la cola de turnos: el proceso que murió a
  # mitad, o el turno que falló y espera otro intento. El camino normal es que
  # el propio webhook procese lo que encola; esto es la red de seguridad.
  cron:
    image: alpine:3
    restart: unless-stopped
    # Un sleep y un curl cada 5 minutos: cualquier cosa por encima de este
    # techo no es este servicio.
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    env_file: .env.production
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      # Bloque literal (|) y no plegado (>): con `>` las líneas más indentadas
      # del curl NO se pliegan, el salto de línea sobrevive y la cabecera
      # Authorization termina ejecutándose como un comando aparte. Resultado:
      # el cron pegaba sin token (401) y la cola se quedaba sin red de
      # seguridad. Acá cada línea es un comando completo y la continuación
      # del curl es explícita con `\`.
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep 300
          curl -fsS -X POST http://app:3000/api/cron/process-queue \
            -H "Authorization: Bearer $$CRON_SECRET" >/dev/null || true
        done

volumes:
  caddy_data:
  caddy_config:
  redis_data:
